name: Update GitHub Pages

on:
  push:
    paths:
      - .github/pages/**

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _site/artifact
          status=$(curl -sS -o _site/artifact/latest.json -w '%{http_code}' "$BASE_URL/artifact/latest.json")
          if [[ "$status" == 404 ]]; then
            rm _site/artifact/latest.json
          elif [[ "$status" != 200 ]]; then
            echo "Could not retrieve deployed artifact metadata (HTTP $status)." >&2
            exit 1
          fi
          cp -R .github/pages/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
