name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix (for example, 1.2.3)
        required: true
        type: string
      build_number:
        description: Build number for this release
        required: true
        type: number
      based_on_version:
        description: Upstream authlib-injector version (for based on text) without a v prefix
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate version and create local tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BASED_ON_VERSION: ${{ inputs.based_on_version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must use x.y.z format, optionally followed by a prerelease suffix." >&2
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Build number must be a non-negative integer." >&2
            exit 1
          fi
          if [[ -n "$BASED_ON_VERSION" ]]; then
            if [[ ! "$BASED_ON_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
              echo "Based-on version must use x.y.z format, optionally followed by a prerelease suffix." >&2
              exit 1
            fi
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release jar
        env:
          AI_VERSION_NUMBER: ${{ inputs.version }}
          AI_BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./gradlew clean shadowJar

      - name: Create GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BASED_ON_VERSION: ${{ inputs.based_on_version }}
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          if [[ ${#jars[@]} -ne 1 || ! -f "${jars[0]}" ]]; then
            echo "Expected exactly one release jar in build/libs." >&2
            exit 1
          fi
          jar_path="${jars[0]}"
          jar_name="$(basename "$jar_path")"
          release_args=("$TAG" "$jar_path"
            --target "$GITHUB_SHA"
            --title "skin-authlib-injector $TAG"
            --generate-notes)
          if [[ -n "$BASED_ON_VERSION" ]]; then
            release_args+=(--notes "Based on [v$BASED_ON_VERSION](https://github.com/yushijinhun/authlib-injector/tree/v$BASED_ON_VERSION) of \`yushijinhun/authlib-injector\`")
          fi
          gh release create "${release_args[@]}"
          echo "asset_name=$jar_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar_path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "published_at=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Pages
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION: ${{ inputs.version }}
          RELEASE_TIME: ${{ steps.publish.outputs.published_at }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.publish.outputs.asset_name }}
          SHA256: ${{ steps.publish.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p _site/artifact
          cp -R .github/pages/. _site/
          jq -n \
            --argjson build_number "$BUILD_NUMBER" \
            --arg version "$VERSION" \
            --arg release_time "$RELEASE_TIME" \
            --arg download_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME" \
            --arg sha256 "$SHA256" \
            '{
              build_number: $build_number,
              version: $version,
              release_time: $release_time,
              download_url: $download_url,
              checksums: {sha256: $sha256}
            }' > _site/artifact/latest.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
