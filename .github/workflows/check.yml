name: Check code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Run Gradle checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check
        run: ./gradlew check