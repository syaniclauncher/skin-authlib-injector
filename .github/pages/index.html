<script>
function fetchLatest(retries) {
    return fetch("artifact/latest.json", { cache: "no-cache" })
        .then(r => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .catch(error => retries
            ? new Promise(resolve => setTimeout(resolve, 1000)).then(() => fetchLatest(retries - 1))
            : Promise.reject(error));
}

fetchLatest(10)
.then(data => {
    document.getElementById("filename").textContent = data.download_url.split("/").pop();
    document.getElementById("version").textContent = data.version;
    document.getElementById("build").textContent = data.build_number;
    document.getElementById("sha256").textContent = data.checksums.sha256;
    document.getElementById("download").href = data.download_url;
})
.catch(error => {
    console.error(error);
    document.querySelector(".card").textContent = "Unable to fetch version information.";
});
</script>
